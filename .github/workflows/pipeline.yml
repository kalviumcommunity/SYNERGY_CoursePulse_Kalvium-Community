name: Weekly Data Pipeline

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run pipeline
        run: >-
          python pipeline.py
          --input data/raw/orders_5000.csv
          --customers data/raw/customers_1000.csv
          --output output/pipeline

      - name: Commit refreshed outputs
        run: |
          git config user.name "Pipeline Bot"
          git config user.email "actions@github.com"
          git add output/pipeline/
          git commit -m "pipeline: automated refresh" || echo "No changes"
          git push